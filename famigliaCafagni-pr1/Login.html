<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Início</title>

    <link rel="stylesheet" href="configuracoes.css">
    <style>
        div#entrar{
            display: flex;
            background-color: #2a8d20;
            color: #fff;

            width: 170px;
            height: 70px;
            font-size: 30px;
            align-items: center;
            justify-content: center;
        }

        div#criar_conta{
            display: flex;
            background-color: #ff2f2b;
            color: #fff;

            width: 170px;
            height: 70px;
            font-size: 30px;
            align-items: center;
            justify-content: center;
        }

        img#logo {
            position: absolute;
            left: 50%;
            transform: translate(-50%);
        }

    </style>

</head>
<body>
    <img src="mídias/logo-famiglia-cafagni.png" alt="Logo da FamigliaCafagni" id="logo">

    <div id="flex_botoes">
        <div id="entrar">
            <p>Entrar</p>
        </div>

        <div id="criar_conta">
            <p>Criar conta</p>
        </div>
    </div>
    
    

</body>
</html>
